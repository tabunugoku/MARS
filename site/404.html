<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Page not found: MARS</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/MARS/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&display=swap">
  <link rel="stylesheet" href="/MARS/assets/site.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("mars-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main id="main" class="wrap not-found">
    <h1 class="section-title">Page not found</h1>
    <p class="lead">This page does not exist, or it has moved.</p>
    <p class="lead" lang="ja">このページは見つかりませんでした。移動したか、存在しません。</p>
    <div class="actions">
      <a class="btn btn-primary" href="https://tabunugoku.github.io/MARS/">Back to MARS</a>
      <a class="btn btn-secondary" href="https://tabunugoku.github.io/MARS/ja/">MARS に戻る</a>
    </div>
  </main>
</body>
</html>
