openapi: 3.0.3
# The contract between web/ and server/. Edit here first, then regenerate:
#   server: go generate ./...            (oapi-codegen, strict std-http server)
#   web:    npm run api:types            (openapi-typescript -> src/api/schema.d.ts)
# OpenAPI 3.0.3 because oapi-codegen does not fully support 3.1 yet.
info:
  title: MARS API
  version: 0.1.1
  description: Self-hosted comic and manga server.
servers:
  - url: /api/v1
# Every operation needs a signed-in user unless it says security: [].
# Cookie sessions must send a same-origin Origin header on writes (CSRF);
# API keys (Bearer) are for apps and OPDS readers.
security:
  - session: []
  - apiKey: []
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Liveness and version
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /public/login-screen:
    get:
      operationId: getLoginScreen
      summary: The only data the sign-in page reads before authentication
      security: []
      responses:
        "200":
          description: What the sign-in page shows beside the form
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginScreen" }
  /fs/directories:
    get:
      operationId: listDirectories
      summary: Folders directly inside a server folder, for picking a library folder (administrators only)
      description: |
        Lists only folders, never files. Names starting with a dot are left out.
        An empty path starts at the filesystem root.
      parameters:
        - { name: path, in: query, required: false, schema: { type: string }, description: "Absolute folder path on the server; empty for the root" }
      responses:
        "200":
          description: The folder and the folders in it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryListing" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /libraries:
    get:
      operationId: listLibraries
      summary: All libraries
      responses:
        "200":
          description: Libraries in name order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Library" } }
    post:
      operationId: createLibrary
      summary: Register a folder as a library and queue its first scan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /libraries/{libraryId}:
    parameters:
      - { name: libraryId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getLibrary
      responses:
        "200":
          description: The library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateLibrary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLibrary
      summary: Forget a library (files on disk are not touched)
      description: The library is hidden at once. Its books and series are removed in the background, in small batches, and the library is gone when that finishes; until then it is not listed and cannot be scanned or changed.
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /libraries/{libraryId}/scan:
    parameters:
      - { name: libraryId, in: path, required: true, schema: { type: string } }
    post:
      operationId: scanLibrary
      summary: Queue a scan (then analysis of new and changed books; with deep, of every book)
      parameters:
        - name: deep
          in: query
          required: false
          description: Analyse every book again, even when its file is unchanged
          schema: { type: boolean }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
  /libraries/{libraryId}/read-progress:
    parameters:
      - { name: libraryId, in: path, required: true, schema: { type: string } }
    put:
      operationId: markLibraryRead
      summary: Mark every book of the library read (completed true) or unread (false) for the caller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesReadUpdate" }
      responses:
        "204": { description: Done }
        "404": { $ref: "#/components/responses/NotFound" }
  /series:
    get:
      operationId: listSeries
      summary: Series the caller may see, filtered, sorted and paged
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
        - { name: search, in: query, description: "Substring of the title, an alternate title or an author", schema: { type: string } }
        - { name: status, in: query, explode: false, schema: { type: array, items: { $ref: "#/components/schemas/SeriesStatus" } } }
        - { name: genres, in: query, description: "Any of these genres; repeat the parameter for each value (values may contain commas)", schema: { type: array, items: { type: string } } }
        - { name: tags, in: query, description: "Any of these tags; repeat the parameter for each value (values may contain commas)", schema: { type: array, items: { type: string } } }
        - { name: publishers, in: query, description: "Any of these publishers; repeat the parameter for each value (values may contain commas)", schema: { type: array, items: { type: string } } }
        - { name: languages, in: query, description: "Any of these languages; repeat the parameter for each value (values may contain commas)", schema: { type: array, items: { type: string } } }
        - { name: authors, in: query, description: "Any of these author names (any role); repeat the parameter for each value (values may contain commas)", schema: { type: array, items: { type: string } } }
        - { name: ageRatingMax, in: query, description: "Age rating at most this; series without one are included", schema: { type: integer, minimum: 0 } }
        - { name: complete, in: query, description: "true: series whose total book count is known and reached; false: the others", schema: { type: boolean } }
        - { name: readState, in: query, explode: false, description: "For the caller", schema: { type: array, items: { $ref: "#/components/schemas/ReadState" } } }
        - { name: sort, in: query, schema: { $ref: "#/components/schemas/SeriesSort" } }
        - { name: desc, in: query, schema: { type: boolean } }
        - { name: limit, in: query, description: "Page size; all when omitted", schema: { type: integer, minimum: 1, maximum: 1000 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: One page of series; X-Total-Count has the count before paging
          headers:
            X-Total-Count:
              schema: { type: integer }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Series" } }
  /genres:
    get:
      operationId: listGenres
      summary: Genre names of the series the caller may see, sorted
      description: The options for the genre filter, without loading every series.
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Distinct genre names
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /series/{seriesId}:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSeries
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateSeries
      summary: Edit series metadata (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /series/{seriesId}/books:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listSeriesBooks
      responses:
        "200":
          description: Books in number order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Book" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /series/{seriesId}/thumbnail:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getSeriesThumbnail
      summary: "Cover of the series, JPEG: an uploaded image, else the local artwork file, else the cover book's thumbnail (see Series.thumbnailSource)"
      responses:
        "200": { $ref: "#/components/responses/Image" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: uploadSeriesThumbnail
      summary: Replace the series cover with an uploaded image (administrators only)
      requestBody:
        required: true
        description: "The bytes of a JPEG, PNG or WebP image (the format is detected from the bytes), at most 20 MB; it is resized to the thumbnail size and stored as JPEG"
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: The series with its new cover
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSeriesThumbnail
      summary: Drop the uploaded series cover; local artwork or the cover book's thumbnail shows again (administrators only)
      responses:
        "200":
          description: The series
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Series" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getBook
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateBook
      summary: Edit book metadata (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/thumbnail:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getBookThumbnail
      summary: Cover thumbnail, JPEG
      responses:
        "200": { $ref: "#/components/responses/Image" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: uploadBookThumbnail
      summary: Replace the book's thumbnail with an uploaded image until it is regenerated or its cover page is chosen again (administrators only)
      requestBody:
        required: true
        description: "The bytes of a JPEG, PNG or WebP image (the format is detected from the bytes), at most 20 MB; it is resized to the thumbnail size and stored as JPEG"
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: The book with its new thumbnail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/pages:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listBookPages
      responses:
        "200":
          description: Pages in reading order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Page" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/pages/{page}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
      - { name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getBookPage
      summary: One page image as stored in the archive (ETag, long private cache)
      responses:
        "200": { $ref: "#/components/responses/Image" }
        "304": { description: Not modified }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/pages/{page}/thumbnail:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
      - { name: page, in: path, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: getBookPageThumbnail
      summary: A small JPEG of one page, for page lists (ETag, long private cache under ?v=)
      responses:
        "200": { $ref: "#/components/responses/Image" }
        "304": { description: Not modified }
        "404": { $ref: "#/components/responses/NotFound" }
  /events:
    get:
      operationId: streamEvents
      summary: Live changes as server-sent events (text/event-stream)
      description: >
        One long-lived stream per app. Each message has an event name and a
        JSON data line: `task` (TaskEvent, administrators only), `library`
        (LibraryEvent), `book` (BookEvent) and `progress` (ProgressEvent, the
        caller's own reading progress). Library, book and progress events are
        sent only for libraries the caller may see. A comment line is sent
        about every 25 seconds as a heartbeat. When the client falls behind
        the stream is closed; on reconnecting, refetch what is shown. A user
        may hold 16 streams and the server 512; past that the request is
        answered 429 with Retry-After.
      parameters:
        - name: lang
          in: query
          description: "Language of task labels and errors in the stream (EventSource cannot send Accept-Language). Any request may use it; it wins over Accept-Language."
          schema: { type: string, enum: [ja, en] }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
  /tasks:
    get:
      operationId: listTasks
      summary: Running and queued tasks, then the most recent finished ones
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Task" } }
  /tasks/{taskId}/cancel:
    parameters:
      - { name: taskId, in: path, required: true, schema: { type: string } }
    post:
      operationId: cancelTask
      responses:
        "204": { description: Cancelled (or already finished) }
        "404": { $ref: "#/components/responses/NotFound" }
  /media/issues:
    get:
      operationId: listMediaIssues
      summary: Books that failed analysis or whose files are gone
      responses:
        "200":
          description: Issues
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MediaIssue" } }
  /setup:
    post:
      operationId: setup
      summary: Create the first administrator (only while no user exists)
      description: >
        Needs the one-time setup token the server prints to its log and writes to
        DATA/setup-token on a first start. Signs the new administrator in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "201":
          description: Created and signed in (session cookie set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/login:
    post:
      operationId: login
      summary: Sign in with a user name (or email) and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Signed in (session cookie set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      operationId: logout
      summary: End this session
      responses:
        "204": { description: Signed out (cookie cleared) }
  /me:
    get:
      operationId: getMe
      summary: The signed-in user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      operationId: updateMe
      summary: Change the caller's own display name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /me/password:
    put:
      operationId: changePassword
      summary: Change the password; other sessions are signed out
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Changed }
        "400": { $ref: "#/components/responses/BadRequest" }
  /me/api-keys:
    get:
      operationId: listApiKeys
      responses:
        "200":
          description: The user's API keys (never the key itself)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ApiKey" } }
    post:
      operationId: createApiKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyCreate" }
      responses:
        "201":
          description: Created; the key is shown only in this response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /me/api-keys/{keyId}:
    parameters:
      - { name: keyId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteApiKey
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /users:
    get:
      operationId: listUsers
      summary: All users (administrators only)
      responses:
        "200":
          description: Users by name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /users/{userId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteUser
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /series/{seriesId}/read-progress:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: string } }
    put:
      operationId: markSeriesRead
      summary: Mark every book of the series read (completed true) or unread (false) for the caller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesReadUpdate" }
      responses:
        "204": { description: Done }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/analyze:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    post:
      operationId: analyzeBook
      summary: Analyze the book again (administrators only); queues its library's analysis
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/adjacent:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getAdjacentBooks
      summary: The previous and next book in the series, for "next volume" in the reader
      responses:
        "200":
          description: Neighbours (null at either end)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdjacentBooks" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/progress:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setBookProgress
      summary: Save the caller's reading position; completed defaults to page == pageCount
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProgressUpdate" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadProgress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: clearBookProgress
      summary: Mark the book unread for the caller
      responses:
        "204": { description: Cleared }
        "404": { $ref: "#/components/responses/NotFound" }
  /dashboard:
    get:
      operationId: getDashboard
      summary: Home shelves for the caller, newest first, at most 12-16 items each
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Shelves
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /search:
    get:
      operationId: search
      summary: Substring search over titles, authors and ISBN (any length, Japanese included)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matches the caller may see
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
  /collections:
    get:
      operationId: listCollections
      summary: Collections with at least one series the caller may see
      responses:
        "200":
          description: By name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Collection" } }
    post:
      operationId: createCollection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /collections/{collectionId}:
    parameters:
      - { name: collectionId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getCollection
      responses:
        "200":
          description: The collection (seriesIds holds only series the caller may see)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateCollection
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteCollection
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /collections/{collectionId}/series:
    parameters:
      - { name: collectionId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listCollectionSeries
      responses:
        "200":
          description: Series in collection order (or title order when not ordered)
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Series" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addCollectionSeriesMany
      summary: Append several members in the given order (ones already there stay where they are); hidden members are kept
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesIdList" }
      responses:
        "200":
          description: The collection as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /collections/{collectionId}/series/{seriesId}:
    parameters:
      - { name: collectionId, in: path, required: true, schema: { type: string } }
      - { name: seriesId, in: path, required: true, schema: { type: string } }
    post:
      operationId: addCollectionSeries
      summary: Append one member (no-op when already there); other members, hidden ones included, are kept
      responses:
        "200":
          description: The collection as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeCollectionSeries
      summary: Remove one member (no-op when absent); other members are kept
      responses:
        "200":
          description: The collection as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/NotFound" }
  /collections/{collectionId}/order:
    parameters:
      - { name: collectionId, in: path, required: true, schema: { type: string } }
    put:
      operationId: reorderCollection
      summary: Reorder the members the caller sees; members it cannot see (in the trash) keep their places
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seriesIds]
              properties:
                seriesIds: { type: array, items: { type: string }, description: "Exactly the visible members, in the new order" }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /read-lists:
    get:
      operationId: listReadLists
      summary: Reading lists with at least one book the caller may see
      responses:
        "200":
          description: By name
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReadList" } }
    post:
      operationId: createReadList
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadListCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadList" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /read-lists/{readListId}:
    parameters:
      - { name: readListId, in: path, required: true, schema: { type: string } }
    get:
      operationId: getReadList
      responses:
        "200":
          description: The list (bookIds holds only books the caller may see)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadList" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateReadList
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReadListUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteReadList
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /read-lists/{readListId}/books:
    parameters:
      - { name: readListId, in: path, required: true, schema: { type: string } }
    get:
      operationId: listReadListBooks
      responses:
        "200":
          description: Books in list order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Book" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addReadListBooks
      summary: Append several books in the given order (ones already there stay where they are); hidden members are kept
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookIdList" }
      responses:
        "200":
          description: The read list as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /read-lists/{readListId}/books/{bookId}:
    parameters:
      - { name: readListId, in: path, required: true, schema: { type: string } }
      - { name: bookId, in: path, required: true, schema: { type: string } }
    post:
      operationId: addReadListBook
      summary: Append one member (no-op when already there); other members, hidden ones included, are kept
      responses:
        "200":
          description: The readlist as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadList" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: removeReadListBook
      summary: Remove one member (no-op when absent); other members are kept
      responses:
        "200":
          description: The readlist as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadList" }
        "404": { $ref: "#/components/responses/NotFound" }
  /read-lists/{readListId}/order:
    parameters:
      - { name: readListId, in: path, required: true, schema: { type: string } }
    put:
      operationId: reorderReadList
      summary: Reorder the members the caller sees; members it cannot see (in the trash) keep their places
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookIds]
              properties:
                bookIds: { type: array, items: { type: string }, description: "Exactly the visible members, in the new order" }
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReadList" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /me/reader-prefs:
    get:
      operationId: getReaderPrefs
      summary: The caller's global reader settings and every series and book override
      responses:
        "200":
          description: All reader settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReaderPrefsAll" }
  /me/reader-prefs/global:
    put:
      operationId: setGlobalReaderPrefs
      summary: Save the global set of one profile (desktop unless profile=mobile)
      parameters:
        - name: profile
          in: query
          required: false
          schema: { type: string, enum: [desktop, mobile], default: desktop }
          description: Each browser chooses which profile it reads with; mobile is meant for phones and small tablets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GlobalReaderPrefs" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
  /me/reader-prefs/series/{seriesId}:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setSeriesReaderPrefs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReaderPrefs" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSeriesReaderPrefs
      summary: Go back to the global settings for this series
      responses:
        "204": { description: Removed (also when there was none) }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/reader-prefs/books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setBookReaderPrefs
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReaderPrefs" }
      responses:
        "204": { description: Saved }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteBookReaderPrefs
      summary: Go back to the series (or global) settings for this book
      responses:
        "204": { description: Removed (also when there was none) }
        "404": { $ref: "#/components/responses/NotFound" }
  /settings:
    get:
      operationId: getSettings
      summary: Server settings (administrators only)
      responses:
        "200":
          description: Current settings, defaults filled in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
    patch:
      operationId: updateSettings
      summary: Change only the given fields, merged into the stored settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ServerSettingsUpdate" }
      responses:
        "200":
          description: Settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /trash:
    get:
      operationId: listTrash
      summary: What is in the trash (administrators only). Books inside a trashed series are counted on the series, not listed.
      responses:
        "200":
          description: Trashed series and books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashList" }
  /trash/series/{seriesId}:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteTrashedSeries
      summary: Remove one trashed series and its books from the database (administrators only; files are not touched)
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /trash/books/{bookId}:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteTrashedBook
      summary: Remove one trashed book from the database (administrators only; files are not touched)
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /trash/empty:
    post:
      operationId: emptyTrash
      summary: Delete series and books whose files are gone (administrators only)
      responses:
        "200":
          description: How many rows were removed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashResult" }
  /public/covers/{seriesId}:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: string }, description: "A series id while loginBackdrop is covers; a book id while it is bookCovers." }
    get:
      operationId: getPublicCover
      summary: A cover on the sign-in page's cover wall (only while loginBackdrop is covers or bookCovers, and only those covers)
      description: The id is a series id while loginBackdrop is covers, and a book id while it is bookCovers.
      security: []
      responses:
        "200": { $ref: "#/components/responses/Image" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/file:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    get:
      operationId: downloadBook
      summary: The book's original file (needs the download permission; Range supported)
      description: >-
        With inline=true a PDF is sent for the browser's own viewer instead
        (Content-Disposition inline, application/pdf). That needs only the
        streaming permission, and is refused for other formats.
      parameters:
        - { name: inline, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: File bytes, Content-Disposition attachment with an RFC 5987 UTF-8 filename
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /series/{seriesId}/file:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: string } }
    get:
      operationId: downloadSeries
      summary: Every book of the series as one ZIP, streamed and stored without recompression (needs the download permission)
      responses:
        "200":
          description: ZIP bytes (no Content-Length), Content-Disposition attachment
          content:
            application/zip:
              schema: { type: string, format: binary }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/regenerate-thumbnail:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    post:
      operationId: regenerateBookThumbnail
      summary: Make the book's thumbnail again from its cover page (administrators only)
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/{bookId}/cover:
    parameters:
      - { name: bookId, in: path, required: true, schema: { type: string } }
    put:
      operationId: setBookCover
      summary: Choose the page the book's thumbnail is made from, and make it (administrators only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoverUpdate" }
      responses:
        "200":
          description: The book with its new cover page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Book" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /series/{seriesId}/regenerate-thumbnails:
    parameters:
      - { name: seriesId, in: path, required: true, schema: { type: string } }
    post:
      operationId: regenerateSeriesThumbnails
      summary: Queue thumbnail regeneration for every book of the series (administrators only)
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
  /libraries/{libraryId}/regenerate-thumbnails:
    parameters:
      - { name: libraryId, in: path, required: true, schema: { type: string } }
    post:
      operationId: regenerateLibraryThumbnails
      summary: Queue thumbnail regeneration for every book of the library (administrators only)
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
  /series/facets:
    get:
      operationId: listSeriesFacets
      summary: Filter options over the series the caller may see
      parameters:
        - { name: libraryId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Distinct values, sorted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesFacets" }
  /series/bulk:
    post:
      operationId: bulkUpdateSeries
      summary: Change the same fields on many series in one transaction; every field changed is locked (administrators only)
      description: Ids the caller cannot see are refused (404) and nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesBulkUpdate" }
      responses:
        "200":
          description: How many series were changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/bulk:
    post:
      operationId: bulkUpdateBooks
      summary: Add or remove tags on many books in one transaction; tags are locked (administrators only)
      description: Ids the caller cannot see are refused (404) and nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookBulkUpdate" }
      responses:
        "200":
          description: How many books were changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /series/read-state:
    post:
      operationId: setSeriesReadState
      summary: Mark every book of these series read or unread for the caller, in one transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesReadState" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /books/read-state:
    post:
      operationId: setBooksReadState
      summary: Mark these books read or unread for the caller, in one transaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BooksReadState" }
      responses:
        "204": { description: Done }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /read-lists/import:
    post:
      operationId: importReadList
      summary: Create a read list from a ComicRack CBL file, matching its entries to books the caller may see
      description: >
        Entries are matched by series title (or an alternate title, ignoring
        case, width and spacing) and book number. With dryRun nothing is
        created and readList is null.
      parameters:
        - { name: dryRun, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        description: The CBL file (XML), at most 5 MB
        content:
          application/xml: { schema: { type: string, format: binary } }
      responses:
        "200":
          description: What matched and what did not
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CblImportResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: cn_session
    apiKey:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Not allowed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many failed attempts; retry later
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The members changed since the caller loaded them; reload and retry
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such item
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: The request is invalid
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Image:
      description: Image bytes
      content:
        image/*:
          schema: { type: string, format: binary }
  schemas:
    Error:
      type: object
      required: [message, code]
      properties:
        message: { type: string, description: "Human-readable, in the request's language (Accept-Language: en gives English, anything else Japanese)" }
        code: { type: string, description: "Stable machine-readable reason, e.g. not_found.book; clients may key their own text on it" }
    LibraryKind:
      type: string
      enum: [manga, webtoon, comics, books]
    ScanInterval:
      type: string
      enum: ["off", hourly, daily, weekly]
    DirectoryListing:
      type: object
      required: [path, directories]
      properties:
        path: { type: string, description: "The listed folder, cleaned and absolute" }
        parent: { type: string, nullable: true, description: "The folder above it; null at the root" }
        directories:
          type: array
          items: { $ref: "#/components/schemas/DirectoryEntry" }
    DirectoryEntry:
      type: object
      required: [name, path, readable]
      properties:
        name: { type: string }
        path: { type: string, description: "Absolute path of this folder" }
        readable: { type: boolean, description: "Whether the server can list it (a library folder must be readable)" }
    Library:
      type: object
      required: [id, name, root, kind, seriesCount, bookCount, sizeBytes, lastScan, scanInterval, watch, importComicInfo, importLocalArtwork, exclude]
      properties:
        id: { type: string }
        name: { type: string }
        root: { type: string }
        kind: { $ref: "#/components/schemas/LibraryKind" }
        seriesCount: { type: integer }
        bookCount: { type: integer }
        sizeBytes: { type: integer, format: int64 }
        lastScan: { type: string, nullable: true, description: "RFC 3339; null before the first scan" }
        scanInterval: { $ref: "#/components/schemas/ScanInterval" }
        watch: { type: boolean, description: "Scan when files change (file system events)" }
        watchError: { type: string, description: "Why watching is not working (empty when it works or is off); interval scans still run" }
        importComicInfo: { type: boolean }
        importLocalArtwork: { type: boolean }
        exclude: { type: array, items: { type: string } }
    LibraryCreate:
      type: object
      required: [name, root, kind]
      properties:
        name: { type: string }
        root: { type: string, description: Absolute folder path on the server }
        kind: { $ref: "#/components/schemas/LibraryKind" }
        scanInterval: { $ref: "#/components/schemas/ScanInterval" }
        watch: { type: boolean }
        importComicInfo: { type: boolean }
        importLocalArtwork: { type: boolean, description: "Use cover/folder/poster .jpg/.jpeg/.png/.webp in a series folder as its cover" }
        exclude: { type: array, items: { type: string } }
    LibraryUpdate:
      type: object
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/LibraryKind" }
        scanInterval: { $ref: "#/components/schemas/ScanInterval" }
        watch: { type: boolean }
        importComicInfo: { type: boolean }
        importLocalArtwork: { type: boolean, description: "Use cover/folder/poster .jpg/.jpeg/.png/.webp in a series folder as its cover" }
        exclude: { type: array, items: { type: string } }
    ReadingDirection:
      type: string
      enum: [ltr, rtl, vertical, webtoon]
    SeriesStatus:
      type: string
      enum: [ongoing, ended, hiatus, abandoned]
    MediaStatus:
      type: string
      enum: [ready, error, unsupported, outdated]
    BookFormat:
      type: string
      enum: [cbz, cbr, cb7, pdf, epub]
    Author:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string, enum: [writer, penciller, colorist, translator, editor, cover] }
    Series:
      type: object
      required: [id, libraryId, title, titleSort, alternateTitles, status, summary, publisher, readingDirection, ageRating, language, genres, tags, authors, totalBookCount, bookCount, booksRead, booksInProgress, thumbnailUrl, thumbnailSource, coverBookId, createdAt, updatedAt, lockedFields]
      properties:
        id: { type: string }
        libraryId: { type: string }
        title: { type: string }
        titleSort: { type: string }
        alternateTitles: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/SeriesStatus" }
        summary: { type: string }
        publisher: { type: string }
        readingDirection: { $ref: "#/components/schemas/ReadingDirection" }
        ageRating: { type: integer, nullable: true }
        language: { type: string }
        genres: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        authors: { type: array, items: { $ref: "#/components/schemas/Author" } }
        totalBookCount: { type: integer, nullable: true }
        bookCount: { type: integer }
        booksRead: { type: integer }
        booksInProgress: { type: integer }
        thumbnailUrl: { type: string }
        thumbnailSource: { $ref: "#/components/schemas/SeriesThumbnailSource" }
        coverBookId: { type: string, nullable: true, description: "The book whose thumbnail is the series cover when no image is uploaded or found; null means the first book" }
        createdAt: { type: string }
        updatedAt: { type: string }
        lockedFields: { type: array, items: { type: string } }
    SeriesThumbnailSource:
      type: string
      enum: [book, upload, local]
    ReadProgress:
      type: object
      required: [page, completed, readAt]
      properties:
        page: { type: integer }
        completed: { type: boolean }
        readAt: { type: string }
    Book:
      type: object
      required: [id, seriesId, seriesTitle, libraryId, title, number, numberSort, summary, releaseDate, isbn, authors, tags, format, path, sizeBytes, pageCount, mediaStatus, progress, thumbnailUrl, thumbnailUploaded, createdAt, lockedFields, coverPage]
      properties:
        id: { type: string }
        seriesId: { type: string }
        seriesTitle: { type: string, description: "Title of the book's series, so a list of books needs no series list" }
        libraryId: { type: string }
        title: { type: string }
        number: { type: number, format: double }
        numberSort: { type: number, format: double }
        summary: { type: string }
        releaseDate: { type: string, nullable: true }
        isbn: { type: string }
        authors: { type: array, items: { $ref: "#/components/schemas/Author" } }
        tags: { type: array, items: { type: string } }
        format: { $ref: "#/components/schemas/BookFormat" }
        path: { type: string }
        sizeBytes: { type: integer, format: int64 }
        pageCount: { type: integer }
        mediaStatus: { $ref: "#/components/schemas/MediaStatus" }
        mediaError: { type: string, description: "Why the book is not readable (empty when ready)" }
        progress:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReadProgress" }]
        thumbnailUrl: { type: string }
        thumbnailUploaded: { type: boolean, description: "The thumbnail is an uploaded image rather than made from the cover page" }
        createdAt: { type: string }
        lockedFields: { type: array, items: { type: string } }
        coverPage: { type: integer, description: "Page the thumbnail is made from (1 unless an administrator chose another)" }
    CoverUpdate:
      type: object
      required: [page]
      properties:
        page: { type: integer, minimum: 1 }
    Page:
      type: object
      required: [number, width, height, mediaType, url, thumbnailUrl]
      properties:
        number: { type: integer }
        width: { type: integer }
        height: { type: integer }
        mediaType: { type: string }
        url: { type: string }
        thumbnailUrl: { type: string, description: "A small JPEG of the page, for page lists" }
    TaskKind:
      type: string
      enum: [scan, analyze, thumbnail, trash]
    TaskState:
      type: string
      enum: [running, queued, done, failed, cancelled]
    Task:
      type: object
      required: [id, kind, label, libraryId, state, progress, startedAt, error]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/TaskKind" }
        label: { type: string }
        libraryId: { type: string, nullable: true }
        state: { $ref: "#/components/schemas/TaskState" }
        progress: { type: number, format: double }
        startedAt: { type: string, nullable: true }
        error: { type: string }
    TaskEvent:
      description: Data of a `task` event; the task as listTasks returns it
      allOf: [{ $ref: "#/components/schemas/Task" }]
    LibraryEvent:
      description: Data of a `library` event, sent when a scan or analysis changed the library's series or books
      type: object
      required: [libraryId, seriesAdded, seriesRemoved, booksAdded, booksChanged, booksRemoved, restored]
      properties:
        libraryId: { type: string }
        seriesAdded: { type: integer }
        seriesRemoved: { type: integer }
        booksAdded: { type: integer }
        booksChanged: { type: integer }
        booksRemoved: { type: integer }
        restored:
          type: integer
          description: Series and unchanged books back from the trash, and unchanged books moved to another series
    BookEvent:
      description: Data of a `book` event, sent when a book was analysed (pages, thumbnail, metadata)
      type: object
      required: [bookId, seriesId, libraryId, mediaStatus]
      properties:
        bookId: { type: string }
        seriesId: { type: string }
        libraryId: { type: string }
        mediaStatus: { $ref: "#/components/schemas/MediaStatus" }
    ProgressEvent:
      description: >
        Data of a `progress` event: the caller's reading progress changed on
        one book (bookId), a whole series (seriesId) or a library. writer is
        the writer the change came from, when it had one.
      type: object
      required: [libraryId]
      properties:
        libraryId: { type: string }
        seriesId: { type: string }
        bookId: { type: string }
        writer: { type: string }
    Role:
      type: string
      enum: [admin, user]
    User:
      type: object
      required: [id, name, email, role, canDownload, canStream, allLibraries, libraryIds, lastActive, locale]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        canDownload: { type: boolean }
        canStream: { type: boolean }
        allLibraries: { type: boolean }
        libraryIds: { type: array, items: { type: string }, description: "Libraries the user may see when allLibraries is false" }
        lastActive: { type: string, nullable: true }
        locale: { $ref: "#/components/schemas/Locale" }
    Locale:
      type: string
      enum: ["", ja, en]
      description: "Interface language the user chose; empty follows the browser"
    UserCreate:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        canDownload: { type: boolean }
        canStream: { type: boolean }
        allLibraries: { type: boolean }
        libraryIds: { type: array, items: { type: string } }
    UserUpdate:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string, description: "Sets a new password and signs the user out everywhere" }
        role: { $ref: "#/components/schemas/Role" }
        canDownload: { type: boolean }
        canStream: { type: boolean }
        allLibraries: { type: boolean }
        libraryIds: { type: array, items: { type: string } }
    SetupRequest:
      type: object
      required: [token, name, email, password]
      properties:
        token: { type: string }
        name: { type: string }
        email: { type: string }
        password: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, description: User name or email }
        password: { type: string }
        remember: { type: boolean, description: "Keep the session for rememberMeDays instead of until the browser closes" }
    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
    ApiKey:
      type: object
      required: [id, name, createdAt, lastUsed]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string }
        lastUsed: { type: string, nullable: true }
    ApiKeyCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
    ApiKeyCreated:
      type: object
      required: [id, name, key]
      properties:
        id: { type: string }
        name: { type: string }
        key: { type: string, description: "Send as Authorization: Bearer <key>; shown only once" }
    MediaIssue:
      type: object
      required: [bookId, kind, detail]
      properties:
        bookId: { type: string }
        kind: { type: string, enum: [error, missing, unsupported] }
        detail: { type: string }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, enum: [ok] }
        version: { type: string }
    LoginBackdrop:
      type: string
      description: "planet: the default artwork (the planet and its orbit). covers: covers of series. bookCovers: covers of books (volumes)."
      enum: [planet, covers, bookCovers]
    LoginScreen:
      type: object
      required: [backdrop, covers, needsSetup]
      properties:
        needsSetup: { type: boolean, description: "No user exists yet: show the first-run setup form" }
        backdrop: { $ref: "#/components/schemas/LoginBackdrop" }
        covers:
          description: Filled only when backdrop is "covers" or "bookCovers".
          type: array
          items: { $ref: "#/components/schemas/LoginCover" }
    LoginCover:
      type: object
      required: [thumbnailUrl, title]
      properties:
        thumbnailUrl: { type: string }
        title: { type: string }
    SeriesSort:
      type: string
      enum: [title, updated, created, releaseDate, bookCount]
      description: "releaseDate is the earliest release date among the series' books (series without one sort last)"
    ReadState:
      type: string
      enum: [unread, inProgress, read]
    SeriesUpdate:
      type: object
      description: >
        Fields to change. Every field given here is also locked, so scans and
        ComicInfo.xml leave it alone; lockedFields, when given, replaces the
        lock list instead.
      properties:
        title: { type: string }
        titleSort: { type: string }
        alternateTitles: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/SeriesStatus" }
        summary: { type: string }
        publisher: { type: string }
        readingDirection: { $ref: "#/components/schemas/ReadingDirection" }
        ageRating: { type: integer, nullable: true, description: "null clears it", x-go-type: "Opt[int]", x-go-type-skip-optional-pointer: true }
        language: { type: string }
        genres: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        authors: { type: array, items: { $ref: "#/components/schemas/Author" } }
        totalBookCount: { type: integer, nullable: true, description: "null clears it", x-go-type: "Opt[int]", x-go-type-skip-optional-pointer: true }
        coverBookId: { type: string, nullable: true, description: "A book of this series; null goes back to the first book. Not a locked field.", x-go-type: "Opt[string]", x-go-type-skip-optional-pointer: true }
        lockedFields: { type: array, items: { type: string } }
    BookUpdate:
      type: object
      description: Fields to change; locking works as in SeriesUpdate
      properties:
        title: { type: string }
        number: { type: number, format: double }
        numberSort: { type: number, format: double }
        summary: { type: string }
        releaseDate: { type: string, nullable: true, description: "YYYY-MM-DD, YYYY-MM or YYYY; null clears it", x-go-type: "Opt[string]", x-go-type-skip-optional-pointer: true }
        isbn: { type: string }
        authors: { type: array, items: { $ref: "#/components/schemas/Author" } }
        tags: { type: array, items: { type: string } }
        lockedFields: { type: array, items: { type: string } }
    AdjacentBooks:
      type: object
      required: [prev, next]
      properties:
        prev:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Book" }]
        next:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Book" }]
    ProgressUpdate:
      type: object
      required: [page]
      properties:
        page: { type: integer, minimum: 1, description: "1-based; at most the book's pageCount" }
        completed: { type: boolean }
        writer:
          type: string
          maxLength: 64
          description: "Names one reader session. With seq, a write older than the last one stored from the same writer is ignored (the answer is the stored progress)."
        seq: { type: integer, minimum: 0, description: "Increases with every write from the same writer" }
    SeriesReadUpdate:
      type: object
      required: [completed]
      properties:
        completed: { type: boolean }
    Dashboard:
      type: object
      required: [keepReading, onDeck, recentlyAddedBooks, recentlyAddedSeries, recentlyUpdatedSeries, recentlyRead]
      properties:
        keepReading: { type: array, items: { $ref: "#/components/schemas/Book" }, description: "Started, not finished, last read first" }
        onDeck: { type: array, items: { $ref: "#/components/schemas/Book" }, description: "First unread book of each series whose previous book is finished" }
        recentlyAddedBooks: { type: array, items: { $ref: "#/components/schemas/Book" } }
        recentlyAddedSeries: { type: array, items: { $ref: "#/components/schemas/Series" } }
        recentlyUpdatedSeries: { type: array, items: { $ref: "#/components/schemas/Series" } }
        recentlyRead: { type: array, items: { $ref: "#/components/schemas/Book" }, description: "Finished, last read first" }
    SearchResult:
      type: object
      required: [series, books, collections, readLists]
      properties:
        series: { type: array, items: { $ref: "#/components/schemas/Series" } }
        books: { type: array, items: { $ref: "#/components/schemas/Book" } }
        collections: { type: array, items: { $ref: "#/components/schemas/Collection" } }
        readLists: { type: array, items: { $ref: "#/components/schemas/ReadList" } }
    SeriesIdList:
      type: object
      required: [seriesIds]
      properties:
        seriesIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
    BookIdList:
      type: object
      required: [bookIds]
      properties:
        bookIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
    SeriesFacets:
      type: object
      required: [genres, tags, publishers, languages, authors, ageRatings]
      properties:
        genres: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        publishers: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string } }
        authors: { type: array, items: { type: string } }
        ageRatings: { type: array, items: { type: integer } }
    SeriesBulkUpdate:
      type: object
      required: [seriesIds]
      description: Fields left out are not changed. Genres and tags are added and removed, not replaced.
      properties:
        seriesIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
        status: { $ref: "#/components/schemas/SeriesStatus" }
        publisher: { type: string }
        readingDirection: { $ref: "#/components/schemas/ReadingDirection" }
        ageRating: { type: integer, nullable: true, description: "null clears it", x-go-type: "Opt[int]", x-go-type-skip-optional-pointer: true }
        language: { type: string }
        addGenres: { type: array, items: { type: string } }
        removeGenres: { type: array, items: { type: string } }
        addTags: { type: array, items: { type: string } }
        removeTags: { type: array, items: { type: string } }
    BookBulkUpdate:
      type: object
      required: [bookIds]
      properties:
        bookIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
        addTags: { type: array, items: { type: string } }
        removeTags: { type: array, items: { type: string } }
    BulkResult:
      type: object
      required: [updated]
      properties:
        updated: { type: integer }
    SeriesReadState:
      type: object
      required: [seriesIds, read]
      properties:
        seriesIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
        read: { type: boolean }
    BooksReadState:
      type: object
      required: [bookIds, read]
      properties:
        bookIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string } }
        read: { type: boolean }
    CblEntry:
      type: object
      required: [series, number, volume, year]
      properties:
        series: { type: string }
        number: { type: string }
        volume: { type: string }
        year: { type: string }
    CblMatch:
      type: object
      required: [entry, book]
      properties:
        entry: { $ref: "#/components/schemas/CblEntry" }
        book: { $ref: "#/components/schemas/Book" }
    CblImportResult:
      type: object
      required: [name, readList, matched, unmatched]
      properties:
        name: { type: string, description: "The list's name from the file (Name element), or the default name" }
        readList:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReadList" }]
        matched: { type: array, items: { $ref: "#/components/schemas/CblMatch" } }
        unmatched: { type: array, items: { $ref: "#/components/schemas/CblEntry" } }
    Collection:
      type: object
      required: [id, name, ordered, seriesIds]
      properties:
        id: { type: string }
        name: { type: string }
        ordered: { type: boolean, description: "Keep seriesIds order; otherwise shown by title" }
        seriesIds: { type: array, items: { type: string } }
    CollectionCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        ordered: { type: boolean }
        seriesIds: { type: array, items: { type: string } }
    CollectionUpdate:
      type: object
      properties:
        name: { type: string }
        ordered: { type: boolean }
        seriesIds: { type: array, items: { type: string }, description: "Replaces the members (administrators see every library)" }
    ReadList:
      type: object
      required: [id, name, summary, bookIds]
      properties:
        id: { type: string }
        name: { type: string }
        summary: { type: string }
        bookIds: { type: array, items: { type: string } }
    ReadListCreate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        summary: { type: string }
        bookIds: { type: array, items: { type: string } }
    ReadListUpdate:
      type: object
      properties:
        name: { type: string }
        summary: { type: string }
        bookIds: { type: array, items: { type: string } }
    ReaderPrefs:
      type: object
      required: [direction, spread, fit, bg]
      properties:
        direction: { $ref: "#/components/schemas/ReadingDirection" }
        spread: { type: string, enum: ["off", "on", cover] }
        fit: { type: string, enum: [screen, width, height, original] }
        bg: { type: string, enum: [black, gray, white] }
    GlobalReaderPrefs:
      type: object
      required: [direction, spread, fit, bg]
      properties:
        direction: { type: string, enum: [ltr, rtl, vertical, webtoon, series], description: "series follows each series' own direction" }
        spread: { type: string, enum: ["off", "on", cover] }
        fit: { type: string, enum: [screen, width, height, original] }
        bg: { type: string, enum: [black, gray, white] }
        splitWide:
          type: boolean
          description: On a portrait screen, show a landscape page (a scanned two-page spread) as its two halves, one after the other
    ReaderPrefsAll:
      type: object
      required: [global, series, books]
      properties:
        global: { $ref: "#/components/schemas/GlobalReaderPrefs" }
        globalMobile:
          allOf: [{ $ref: "#/components/schemas/GlobalReaderPrefs" }]
          description: The mobile profile's global set; absent until it is first saved
        series: { type: object, additionalProperties: { $ref: "#/components/schemas/ReaderPrefs" }, description: "By series id" }
        books: { type: object, additionalProperties: { $ref: "#/components/schemas/ReaderPrefs" }, description: "By book id" }
    ServerSettings:
      type: object
      required: [port, taskThreads, thumbnailSize, thumbnailFormat, rememberMeDays, deleteEmptyCollections, opdsEnabled, komgaApiEnabled, loginBackdrop]
      properties:
        port: { type: integer, description: "Takes effect after a restart" }
        taskThreads: { type: integer }
        thumbnailSize: { type: string, enum: [small, medium, large, xlarge] }
        thumbnailFormat: { type: string, enum: [webp, jpeg, avif], description: "Format of thumbnails made from now on; existing ones change when regenerated. OPDS and the Komga API always serve JPEG." }
        rememberMeDays: { type: integer }
        deleteEmptyCollections: { type: boolean }
        opdsEnabled: { type: boolean, description: "Serves the OPDS 1.2 catalog at /opds/v1.2/catalog" }
        komgaApiEnabled: { type: boolean, description: "Serves a Komga-compatible API at /komga (for the Mihon/Tachiyomi Komga extension)" }
        loginBackdrop: { $ref: "#/components/schemas/LoginBackdrop" }
    ServerSettingsUpdate:
      type: object
      properties:
        port: { type: integer }
        taskThreads: { type: integer }
        thumbnailSize: { type: string, enum: [small, medium, large, xlarge] }
        thumbnailFormat: { type: string, enum: [webp, jpeg, avif] }
        rememberMeDays: { type: integer }
        deleteEmptyCollections: { type: boolean }
        opdsEnabled: { type: boolean }
        komgaApiEnabled: { type: boolean }
        loginBackdrop: { $ref: "#/components/schemas/LoginBackdrop" }
    TrashList:
      type: object
      required: [series, books]
      properties:
        series: { type: array, items: { $ref: "#/components/schemas/TrashedSeries" } }
        books: { type: array, items: { $ref: "#/components/schemas/TrashedBook" } }
    TrashedSeries:
      type: object
      required: [id, libraryId, title, path, deletedAt, bookCount]
      properties:
        id: { type: string }
        libraryId: { type: string }
        title: { type: string }
        path: { type: string, description: "Folder (or one-shot file) relative to the library root" }
        deletedAt: { type: string, format: date-time }
        bookCount: { type: integer, description: "Books that go with it" }
    TrashedBook:
      type: object
      required: [id, seriesId, seriesTitle, libraryId, title, path, deletedAt]
      properties:
        id: { type: string }
        seriesId: { type: string }
        seriesTitle: { type: string }
        libraryId: { type: string }
        title: { type: string }
        path: { type: string, description: "File path relative to the library root" }
        deletedAt: { type: string, format: date-time }
    TrashResult:
      type: object
      required: [series, books]
      properties:
        series: { type: integer }
        books: { type: integer }
    MeUpdate:
      type: object
      required: [name]
      properties:
        name: { type: string }
        locale: { $ref: "#/components/schemas/Locale" }
