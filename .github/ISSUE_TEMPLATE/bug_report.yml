name: Bug report
description: Something in MARS does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, please use a private report instead (see SECURITY.md).
        日本語で書いても構いません。
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or version you run, for example `0.1.0` or `main@abc1234`
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run MARS?
      options:
        - Docker / docker compose
        - TrueNAS SCALE app
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client
      description: Browser and device, or the app (Mihon, an OPDS reader, …) if the problem is there
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: Relevant lines from `docker logs mars` (remove anything private)
      render: text
