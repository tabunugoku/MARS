name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-budget.mjs
      - run: npm run i18n:check
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  server:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: server
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- .
      - run: go vet ./...
      - run: go test ./...
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/internal/webui/dist
      - name: Build static binaries
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/cominavi-amd64 ./cmd/cominavi
          GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/cominavi-arm64 ./cmd/cominavi
          ls -l /tmp/cominavi-*

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: cominavi:ci
          build-args: VERSION=ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test, size and memory
        run: bash .github/scripts/smoke-image.sh cominavi:ci
      # The build stages run natively and cross-compile, so arm64 costs only
      # the Go build; this checks it still builds and reports its size.
      - name: Build image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: cominavi:ci-arm64
          cache-from: type=gha
      - name: arm64 image size
        run: |
          size=$(docker image inspect -f '{{.Size}}' cominavi:ci-arm64)
          line="| image size (linux/arm64) | $(( size / 1024 / 1024 )) MiB ($size bytes) |"
          echo "$line"
          echo "$line" >>"$GITHUB_STEP_SUMMARY"
